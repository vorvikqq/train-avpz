<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЯПЗТ — Тренажер тестів</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a1d2e;
    border-bottom: 1px solid #2d3155;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-title {
    font-size: 15px;
    font-weight: 700;
    color: #7c83f5;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: #8890b0;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #e8eaf0;
  }
  
  .stat-value.green { color: #4caf50; }
  .stat-value.red { color: #ef5350; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 24px;
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 720px;
    background: #1a1d2e;
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #5c63e8, #8b91f7);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .progress-label {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #5a6080;
    margin-top: 6px;
  }

  .card {
    background: #1a1d2e;
    border: 1px solid #2d3155;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 720px;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-badge {
    font-size: 11px;
    font-weight: 600;
    color: #5a6080;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 17px;
    line-height: 1.6;
    color: #d8daf0;
    margin-bottom: 28px;
    font-weight: 500;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 2px solid #2d3155;
    cursor: pointer;
    transition: all 0.15s ease;
    background: #12151f;
  }

  .option:hover:not(.disabled) {
    border-color: #5c63e8;
    background: #1e213a;
  }

  .option.selected {
    border-color: #5c63e8;
    background: #1e213a;
  }

  .option.correct {
    border-color: #4caf50 !important;
    background: #0d2218 !important;
  }

  .option.wrong {
    border-color: #ef5350 !important;
    background: #220d0d !important;
  }

  .option.reveal-correct {
    border-color: #4caf50 !important;
    background: #0d2218 !important;
  }

  .option.disabled {
    cursor: default;
  }

  .option-letter {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #2d3155;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #8890b0;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s;
  }

  .option.selected .option-letter {
    background: #5c63e8;
    color: white;
  }

  .option.correct .option-letter {
    background: #4caf50 !important;
    color: white !important;
  }

  .option.wrong .option-letter {
    background: #ef5350 !important;
    color: white !important;
  }

  .option.reveal-correct .option-letter {
    background: #4caf50 !important;
    color: white !important;
  }

  .option-text {
    font-size: 15px;
    line-height: 1.5;
    color: #c0c4dc;
    flex: 1;
  }

  .actions {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    margin-top: 4px;
  }

  button {
    padding: 13px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .btn-check {
    background: #5c63e8;
    color: white;
    flex: 1;
  }

  .btn-check:hover:not(:disabled) {
    background: #6e75f0;
  }

  .btn-check:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-next {
    background: #2d3155;
    color: #c0c4dc;
    flex: 1;
  }

  .btn-next:hover {
    background: #363b6a;
    color: #e8eaf0;
  }

  .result-banner {
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
    max-width: 720px;
    display: none;
  }

  .result-banner.correct {
    background: #0d2218;
    border: 1px solid #4caf50;
    color: #81c784;
    display: block;
  }

  .result-banner.wrong {
    background: #220d0d;
    border: 1px solid #ef5350;
    color: #ef9a9a;
    display: block;
  }

  .controls {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-mode {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: #2d3155;
    color: #8890b0;
    border: 2px solid transparent;
  }

  .btn-mode.active {
    border-color: #5c63e8;
    color: #a0a7f8;
  }

  .btn-mode:hover {
    background: #363b6a;
  }

  .btn-restart {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: #1a1d2e;
    color: #5a6080;
    border: 1px solid #2d3155;
    margin-left: auto;
  }

  .btn-restart:hover {
    color: #ef5350;
    border-color: #ef5350;
  }

  .finish-screen {
    text-align: center;
    padding: 48px 32px;
    background: #1a1d2e;
    border: 1px solid #2d3155;
    border-radius: 16px;
    width: 100%;
    max-width: 720px;
  }

  .finish-emoji { font-size: 56px; margin-bottom: 16px; }
  .finish-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .finish-sub { font-size: 15px; color: #8890b0; margin-bottom: 24px; }
  .finish-score { font-size: 48px; font-weight: 800; color: #7c83f5; margin-bottom: 4px; }

  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <div class="header-title">ЯПЗТ — Тренажер</div>
  <div class="header-stats">
    <div class="stat"><span class="stat-value green" id="stat-correct">0</span><span>Правильно</span></div>
    <div class="stat"><span class="stat-value red" id="stat-wrong">0</span><span>Помилки</span></div>
    <div class="stat"><span class="stat-value" id="stat-remain">0</span><span>Залишилось</span></div>
  </div>
</header>

<div class="main">
  <div class="controls">
    <button class="btn-mode active" id="mode-all" onclick="setMode('all')">Всі питання</button>
    <button class="btn-mode" id="mode-shuffle" onclick="setMode('shuffle')">Перемішати</button>
    <button class="btn-mode" id="mode-wrong" onclick="setMode('wrong')">Тільки помилки</button>
    <button class="btn-restart" onclick="restart()">↺ Спочатку</button>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="progress-label">
    <span id="progress-text">Питання 1 з 238</span>
    <span id="progress-pct">0%</span>
  </div>

  <div class="card" id="quiz-card">
    <div class="q-badge" id="q-badge">Питання 1</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>

  <div class="result-banner" id="result-banner"></div>

  <div class="actions">
    <button class="btn-check" id="btn-check" onclick="checkAnswer()" disabled>Перевірити</button>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Наступне →</button>
  </div>

  <div class="finish-screen hidden" id="finish-screen">
    <div class="finish-emoji" id="finish-emoji">🎉</div>
    <div class="finish-title">Тест завершено!</div>
    <div class="finish-sub" id="finish-sub"></div>
    <div class="finish-score" id="finish-score"></div>
    <br><br>
    <button onclick="restart()" style="background:#5c63e8;color:white;padding:14px 32px;border-radius:10px;font-size:16px;font-weight:600;border:none;cursor:pointer;">Пройти ще раз</button>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"num":1,"question":"1. Яке з наведених тверджень найточніше описує суть процесу верифікації  програмного забезпечення?","options":[{"letter":"A","text":"перевірка відповідності ПЗ вимогам кінцевого користувача","correct":false},{"letter":"B","text":"перевірка коду шляхом запуску програми в тестовому середовищі","correct":false},{"letter":"C","text":"аналіз відповідності ПЗ специфікаціям без виконання коду","correct":true},{"letter":"D","text":"визначення показників надійності на основі відгуків користувачів.","correct":false}],"correct":"C"},{"num":2,"question":"2. Який з типів помилок є найбільш складним для виявлення через зміну поведінки при  спробі його діагностики?;","options":[{"letter":"A","text":"шредінбаг","correct":false},{"letter":"B","text":"борбаг","correct":false},{"letter":"C","text":"гейзінбаг","correct":true},{"letter":"D","text":"статистичний баг.","correct":false}],"correct":"C"},{"num":3,"question":"3. Яка характеристика якості програмного забезпечення за моделлю ISO/IEC 25010  відповідає здатності ПЗ забезпечувати захист інформації від несанкціонованого доступу?","options":[{"letter":"A","text":"надійність","correct":false},{"letter":"B","text":"безпека","correct":true},{"letter":"C","text":"сумісність","correct":false},{"letter":"D","text":"ефективність продуктивності.","correct":false}],"correct":"B"},{"num":4,"question":"4. У чому полягає головна відмінність між тестуванням і забезпеченням якості  (Quality Assurance, QA)?","options":[{"letter":"A","text":"Тестування орієнтоване на процеси, тоді як QA – на продукт","correct":false},{"letter":"B","text":"QA – це частина тестування, що охоплює лише етап валідації","correct":false},{"letter":"C","text":"Тестування фокусується на виявленні дефектів, тоді як QA – на запобіганні їх появі; \\","correct":true},{"letter":"D","text":"Тестування виконується вручну, а QA – автоматизовано","correct":false}],"correct":"C"},{"num":5,"question":"5. Яке визначення найточніше описує «тестову ситуацію» (test scenario)?","options":[{"letter":"A","text":"повний набір кроків для перевірки конкретної функціональності","correct":false},{"letter":"B","text":"формалізований список помилок, виявлених у системі","correct":false},{"letter":"C","text":"загальний опис умов або дій, які потребують перевірки","correct":true},{"letter":"D","text":"звіт про результати проведеного тестування.","correct":false}],"correct":"C"},{"num":6,"question":"6. Який з історичних підходів до оцінювання якості програмного забезпечення вперше  ввів поняття «проактивного забезпечення якості»?","options":[{"letter":"A","text":"модель Боема","correct":false},{"letter":"B","text":"модель SATC","correct":true},{"letter":"C","text":"модель ISO 9126","correct":false},{"letter":"D","text":"модель Гецці.","correct":false}],"correct":"B"},{"num":7,"question":"7. Що є головною особливістю дефекту типу «шредінбаг»?","options":[{"letter":"A","text":"виявляється тільки за допомогою статистичних методів","correct":false},{"letter":"B","text":"може зникати при спробі його діагностики","correct":false},{"letter":"C","text":"проявляється лише після того, як його знайдено в коді","correct":true},{"letter":"D","text":"пов’язаний з нестачею пам’яті при роботі програми.","correct":false}],"correct":"C"},{"num":8,"question":"8. Який термін найточніше описує ситуацію, коли програмне забезпечення  некоректно виконує свої функції під час роботи, спричиняючи видимі збої для  користувача?","options":[{"letter":"A","text":"дефект","correct":false},{"letter":"B","text":"помилка","correct":false},{"letter":"C","text":"збій","correct":true},{"letter":"D","text":"аварія.","correct":false}],"correct":"C"},{"num":9,"question":"9. Що з переліченого належить до характеристик якості ПЗ відповідно до моделі  SQuaRE (ISO/IEC 25010)?","options":[{"letter":"A","text":"витрати на впровадження","correct":false},{"letter":"B","text":"зовнішній інтерфейс користувача","correct":false},{"letter":"C","text":"портативність","correct":true},{"letter":"D","text":"частота оновлень.","correct":false}],"correct":"C"},{"num":10,"question":"10. У якому випадку тестування програмного забезпечення вважається успішним  відповідно до принципу Е. Дейкстри?","options":[{"letter":"A","text":"якщо система функціонує без збоїв протягом 100% тестів","correct":false},{"letter":"B","text":"якщо тестування довело відсутність будь-яких помилок","correct":false},{"letter":"C","text":"якщо тестування виявило принаймні один дефект","correct":true},{"letter":"D","text":"якщо всі тест-кейси завершилися позитивно.","correct":false}],"correct":"C"},{"num":11,"question":"11. Яка характеристика програмного забезпечення відображає його здатність  функціонувати без збоїв у визначених умовах протягом заданого часу?","options":[{"letter":"A","text":"стійкість","correct":false},{"letter":"B","text":"надійність","correct":true},{"letter":"C","text":"відновлюваність","correct":false},{"letter":"D","text":"безвідмовність.","correct":false}],"correct":"B"},{"num":12,"question":"12. Яка з наведених моделей передбачає, що інтенсивність відмов зменшується  пропорційно до кількості усунутих помилок?","options":[{"letter":"A","text":"модель Шумана","correct":false},{"letter":"B","text":"модель Мусси","correct":false},{"letter":"C","text":"модель Джелінського-Моранди","correct":true},{"letter":"D","text":"модель Ямади.","correct":false}],"correct":"C"},{"num":13,"question":"13. Що з наведеного НЕ є складовою функціональної надійності програмного  забезпечення?","options":[{"letter":"A","text":"безвідмовність","correct":false},{"letter":"B","text":"відновлюваність","correct":false},{"letter":"C","text":"портативність","correct":true},{"letter":"D","text":"захищеність.","correct":false}],"correct":"C"},{"num":14,"question":"14. У чому полягає особливість S-подібної моделі Ямади у контексті аналізу надійності  ПЗ?","options":[{"letter":"A","text":"вона базується на гіпергеометричному розподілі","correct":false},{"letter":"B","text":"вона e}],"correct":"B"},{"num":232,"question":"232. Що з наведеного найточніше описує атрибут «Функціональна відповідність»?","options":[{"letter":"A","text":"можливість ПЗ адаптуватися до змін користувача","correct":false},{"letter":"B","text":"вміння програми взаємодіяти з іншими системами","correct":false},{"letter":"C","text":"ступінь реалізації функцій, необхідних користувачу","correct":true},{"letter":"D","text":"захист від несанкціонованого доступу.","correct":false}],"correct":"C"},{"num":233,"question":"233. Який атрибут якості відповідає за простоту аналізу й усунення дефектів у ПЗ?","options":[{"letter":"A","text":"надійність","correct":false},{"letter":"B","text":"продуктивність","correct":false},{"letter":"C","text":"супроводжуваність","correct":true},{"letter":"D","text":"портативність.","correct":false}],"correct":"C"},{"num":234,"question":"234. Який з етапів оцінки якості ПЗ передбачає визначення важливості характеристик?","options":[{"letter":"A","text":"вибір метрик","correct":false},{"letter":"B","text":"розрахунок комплексного індексу","correct":false},{"letter":"C","text":"формування структури оцінювання з ваговими коефіцієнтами","correct":true},{"letter":"D","text":"аналіз архітектури ПЗ.","correct":false}],"correct":"C"},{"num":235,"question":"235. Що з наведеного НЕ є атрибутом якості в ISO/IEC 25010:2011?","options":[{"letter":"A","text":"сумісність","correct":false},{"letter":"B","text":"ефективність відлагодження","correct":false},{"letter":"C","text":"продуктивність виконання завдань","correct":false},{"letter":"D","text":"точність передачі сигналу.","correct":true}],"correct":"D"},{"num":236,"question":"236. Який з атрибутів якості входить до складу характеристики «Зручність використання»?","options":[{"letter":"A","text":"середній час відмови","correct":false},{"letter":"B","text":"зрозумілість функцій","correct":true},{"letter":"C","text":"використання ресурсу пам'яті","correct":false},{"letter":"D","text":"надійність архітектури.","correct":false}],"correct":"B"},{"num":237,"question":"237. Що відображає атрибут «Середній час відновлення» у моделі якості?","options":[{"letter":"A","text":"ефективність адаптації до нового середовища","correct":false},{"letter":"B","text":"швидкість усунення виявлених помилок","correct":false},{"letter":"C","text":"швидкість повернення ПЗ до роботи після відмови","correct":true},{"letter":"D","text":"швидкість передачі даних у системі.","correct":false}],"correct":"C"},{"num":238,"question":"238. У чому полягає мета використання експертних оцінок в оцінюванні якості ПЗ?","options":[{"letter":"A","text":"заміна реального тестування метриками","correct":false},{"letter":"B","text":"уніфікація термінів між розробниками","correct":false},{"letter":"C","text":"визначення значущості характеристик і вагових коефіцієнтів","correct":true},{"letter":"D","text":"аналіз відповідності продукту інтерфейсним стандартам.","correct":false}],"correct":"C"},{"num":239,"question":"239. Яка характеристика якості згідно з ISO/IEC 25010 охоплює такі атрибути, як точність, обчислювальна правильність і функціональна повнота?","options":[{"letter":"A","text":"юзабіліті","correct":false},{"letter":"B","text":"функціональна придатність","correct":true},{"letter":"C","text":"надійність","correct":false},{"letter":"D","text":"безпечність.","correct":false}],"correct":"B"},{"num":240,"question":"240. Комплексний показник якості ПЗ зазвичай розраховується шляхом:","options":[{"letter":"A","text":"підсумовування кількості знайдених багів","correct":false},{"letter":"B","text":"середнього арефметичного всіх вимірюваних показників","correct":false},{"letter":"C","text":"агрегування оцінок характеристик з урахуванням їхніх ваг","correct":true},{"letter":"D","text":"підрахунку кількості виконаних тест-кейсів без помилок.","correct":false}],"correct":"C"}];

let questions = [];
let currentIndex = 0;
let selectedLetter = null;
let checked = false;
let correctCount = 0;
let wrongCount = 0;
let mode = 'all';
let wrongQuestions = [];
let wrongNums = new Set();

function setMode(m) {
  mode = m;
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + m).classList.add('active');
  restart();
}

function restart() {
  correctCount = 0;
  wrongCount = 0;
  currentIndex = 0;
  wrongQuestions = [];
  
  if (mode === 'all') {
    questions = [...ALL_QUESTIONS];
  } else if (mode === 'shuffle') {
    questions = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5);
  } else if (mode === 'wrong') {
    questions = wrongNums.size > 0 
      ? ALL_QUESTIONS.filter(q => wrongNums.has(q.num))
      : [...ALL_QUESTIONS];
    wrongNums = new Set();
  }
  
  updateStats();
  document.getElementById('finish-screen').classList.add('hidden');
  document.getElementById('quiz-card').classList.remove('hidden');
  document.querySelector('.progress-bar-wrap').style.display = '';
  document.querySelector('.progress-label').style.display = '';
  document.querySelector('.actions').style.display = '';
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= questions.length) {
    showFinish();
    return;
  }
  
  checked = false;
  selectedLetter = null;
  
  const q = questions[currentIndex];
  const total = questions.length;
  
  document.getElementById('q-badge').textContent = `Питання ${currentIndex + 1} з ${total}`;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('progress-text').textContent = `Питання ${currentIndex + 1} з ${total}`;
  const pct = Math.round((currentIndex / total) * 100);
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = pct + '%';
  
  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  
  q.options.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${opt.letter}</div>
      <div class="option-text">${opt.text}</div>
    `;
    div.addEventListener('click', () => selectOption(opt.letter, div));
    optionsEl.appendChild(div);
  });
  
  const banner = document.getElementById('result-banner');
  banner.className = 'result-banner';
  banner.textContent = '';
  
  document.getElementById('btn-check').disabled = true;
  document.getElementById('btn-next').textContent = 'Пропустити →';
  
  updateStats();
}

function selectOption(letter, el) {
  if (checked) return;
  
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedLetter = letter;
  document.getElementById('btn-check').disabled = false;
}

function checkAnswer() {
  if (checked || !selectedLetter) return;
  checked = true;
  
  const q = questions[currentIndex];
  const isCorrect = selectedLetter === q.correct;
  
  document.querySelectorAll('.option').forEach((el, i) => {
    const opt = q.options[i];
    el.classList.add('disabled');
    if (opt.letter === q.correct) {
      if (opt.letter === selectedLetter) {
        el.classList.add('correct');
      } else {
        el.classList.add('reveal-correct');
      }
    } else if (opt.letter === selectedLetter) {
      el.classList.add('wrong');
    }
  });
  
  const banner = document.getElementById('result-banner');
  if (isCorrect) {
    correctCount++;
    banner.className = 'result-banner correct';
    banner.textContent = '✓ Правильно!';
  } else {
    wrongCount++;
    wrongNums.add(q.num);
    const correctOpt = q.options.find(o => o.letter === q.correct);
    banner.className = 'result-banner wrong';
    banner.textContent = `✗ Неправильно. Правильна відповідь: ${q.correct}) ${correctOpt ? correctOpt.text : ''}`;
  }
  
  document.getElementById('btn-check').disabled = true;
  document.getElementById('btn-next').textContent = 'Наступне →';
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  showQuestion();
}

function updateStats() {
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-remain').textContent = Math.max(0, questions.length - currentIndex);
}

function showFinish() {
  document.getElementById('quiz-card').classList.add('hidden');
  document.querySelector('.progress-bar-wrap').style.display = 'none';
  document.querySelector('.progress-label').style.display = 'none';
  document.querySelector('.actions').style.display = 'none';
  document.getElementById('result-banner').className = 'result-banner';
  
  const total = correctCount + wrongCount;
  const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const screen = document.getElementById('finish-screen');
  screen.classList.remove('hidden');
  
  document.getElementById('finish-emoji').textContent = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '📚';
  document.getElementById('finish-score').textContent = pct + '%';
  document.getElementById('finish-sub').textContent = 
    `Правильно: ${correctCount} з ${total} питань`;
}

// init
restart();
</script>
